[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first voice-activated personal assistant."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["jarvis*"]
