[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first voice-activated personal assistant."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[project.optional-dependencies]
wakeword = ["sherpa-onnx==1.13.7", "numpy>=1.23,<3"]
vad = ["sherpa-onnx==1.13.7", "numpy>=1.23,<3"]
tts = ["sherpa-onnx==1.13.7", "numpy>=1.23,<3"]

[tool.setuptools.package-data]
"jarvis.wakeword" = ["keywords.txt"]
